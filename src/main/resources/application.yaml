server:
  # Porta do Eureka Server
  port: 8761
  shutdown: graceful

  compression:
    # Habilita compressão HTTP
    enabled: true

spring:
  application:
    # Nome da aplicação
    name: eureka-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

eureka:
  instance:
    # Hostname configurável por variável de ambiente
    hostname: ${EUREKA_HOSTNAME:localhost}

    # Prioriza o endereço IP da instância
    prefer-ip-address: true

  client:
    # Servidor standalone: não se registra em outro Eureka
    register-with-eureka: false

    # Servidor standalone: não consome outro registry
    fetch-registry: false

    service-url:
      # URL do próprio Eureka.
      # Pode ser sobrescrita por EUREKA_URL.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      # Endpoints disponibilizados pelo Actuator
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # Em produção, prefira "when-authorized", valor para dev "always"
      show-details: ${HEALTH_SHOW_DETAILS:never}

logging:
  level:
    # Logs internos do Eureka
    "[com.netflix.eureka]": WARN

    # Logs relacionados ao Discovery Client
    "[com.netflix.discovery]": WARN
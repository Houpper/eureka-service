server:
  # Porta do Eureka Server
  port: 8761

  compression:
    # Habilita compressão HTTP
    enabled: true

spring:
  application:
    # Nome da aplicação
    name: eureka-service

eureka:
  instance:
    # Hostname configurável por variável de ambiente
    hostname: ${EUREKA_HOSTNAME:localhost}

    # Prioriza o endereço IP da instância
    prefer-ip-address: true

  client:
    # Servidor standalone: não se registra em outro Eureka
    register-with-eureka: false

    # Servidor standalone: não consome outro registry
    fetch-registry: false

    service-url:
      # URL do próprio Eureka.
      # Pode ser sobrescrita por EUREKA_URL.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      # Endpoints disponibilizados pelo Actuator
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      # Em produção, prefira "when-authorized"
      show-details: ${HEALTH_SHOW_DETAILS:always}

logging:
  level:
    # Logs internos do Eureka
    "[com.netflix.eureka]": WARN

    # Logs relacionados ao Discovery Client
    "[com.netflix.discovery]": WARN